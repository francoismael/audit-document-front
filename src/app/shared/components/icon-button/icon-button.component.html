<button
  class="icon-button"
  type="button"
  [class.icon-button-primary]="variant() === 'primary'"
  [class.icon-button-danger]="variant() === 'danger'"
  [attr.aria-label]="label()"
  [title]="label()"
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
</button>
