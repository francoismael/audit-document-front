@if (isOpen()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <section
      class="modal"
      [class.modal-sm]="size() === 'sm'"
      [class.modal-lg]="size() === 'lg'"
      [class.modal-danger]="confirmVariant() === 'danger'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
    >
      <header class="modal-header">
        @if (headerIcon()) {
          <span class="modal-icon" aria-hidden="true">
            <mat-icon>{{ headerIcon() }}</mat-icon>
          </span>
        }

        <div class="modal-heading">
          <h2 class="modal-title">{{ title() }}</h2>
          @if (description()) {
            <p class="modal-description">{{ description() }}</p>
          }
        </div>

        <app-icon-button icon="close" label="Fermer la fenêtre" [disabled]="loading()" (clicked)="onCancel()" />
      </header>

      <div class="modal-content">
        <ng-content />
      </div>

      <footer class="modal-actions">
        <app-button variant="outline" [disabled]="loading()" (clicked)="onCancel()">
          {{ cancelText() }}
        </app-button>
        <app-button [variant]="confirmVariant()" [disabled]="loading()" (clicked)="onConfirm()">
          {{ loading() ? 'Traitement...' : confirmText() }}
        </app-button>
      </footer>
    </section>
  </div>
}
