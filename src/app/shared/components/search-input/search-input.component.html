<div class="search-input">
  <label class="search-input-label" [for]="id()">{{ label() }}</label>

  <div class="search-input-control">
    <svg
      class="search-input-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>

    <input
      class="search-input-field"
      type="search"
      [id]="id()"
      [value]="text()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      autocomplete="off"
      (input)="onValueInput($event)"
      (keydown)="onKeydown($event)"
    />

    @if (waiting() || loading()) {
      <span class="search-input-loader" role="status" aria-label="Recherche en cours"></span>
    } @else if (text().length > 0 && !disabled()) {
      <button class="search-input-clear" type="button" aria-label="Effacer la recherche" (click)="clearSearch()">
        &times;
      </button>
    }
  </div>
</div>
