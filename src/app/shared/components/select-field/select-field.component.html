
<div class="select-field">
  <label class="select-field-label" [for]="id()">
    {{ config().label }}

    @if (config().required) {
      <span class="select-field-required" aria-hidden="true">*</span>
    }
  </label>

  <div class="select-field-control-wrapper">
    <select
      class="select-field-control"
      [id]="id()"
      [value]="value()"
      [required]="config().required ?? false"
      [disabled]="config().disabled ?? false"
      [attr.aria-invalid]="invalid()"
      [attr.aria-describedby]="invalid() ? id() + '-error' : null"
      (change)="onValueChange($event)"
    >
      <!-- [selected] on each option keeps the choice when the options render after the value. -->
      <option value="" [disabled]="!config().allowEmpty" [selected]="!value()">
        {{ config().placeholder ?? 'Sélectionner une option' }}
      </option>

      @for (option of config().options; track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>

    <span class="select-field-arrow" aria-hidden="true"></span>
  </div>

  @if (invalid()) {
    <p class="select-field-error" [id]="id() + '-error'" role="alert">
      {{ errorMessage }}
    </p>
  }
</div>
