<div class="main-layout">
  <app-header [menuOpen]="sidebarOpen()" (menuToggle)="toggleSidebar()" />

  <div class="main-layout-body">
    <app-sidebar [open]="sidebarOpen()" (linkClicked)="closeSidebar()" />

    @if (sidebarOpen()) {
      <div class="main-layout-backdrop" aria-hidden="true" (click)="closeSidebar()"></div>
    }

    <main #content class="main-layout-content">
      <router-outlet />
    </main>
    <app-scroll-navigator [target]="content" />
  </div>
</div>
