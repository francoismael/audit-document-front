<nav id="main-menu" class="sidebar" [class.open]="open()" aria-label="Menu principal">
  <ul class="sidebar-menu">
    @for (item of items; track item.route) {
      <li>
        <a
          class="sidebar-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="linkClicked.emit()"
        >
          <mat-icon class="sidebar-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
